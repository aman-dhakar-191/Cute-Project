<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Komal! 🌸💕</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ff7eb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Love World">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff0f7;
  --pink: #ff7eb3;
  --rose: #ff3d7f;
  --lilac: #c9a0dc;
  --peach: #ffb347;
  --mint: #6edcc4;
  --sky: #74c7ec;
  --gold: #ffd700;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  width: 100vw; height: 100vh;
  cursor: none;
  user-select: none;
}
#cur { position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); font-size:22px; transition:transform 0.08s; }

/* SKY */
.sky {
  position:fixed; inset:0;
  background: linear-gradient(180deg, #ffd6ec 0%, #ffe4d6 40%, #fff0d6 70%, #fff0f7 100%);
  z-index:0;
}

/* SUN */
.sun {
  position:fixed; top:40px; right:80px;
  width:80px; height:80px;
  background:radial-gradient(circle,#ffe066 60%,#ffb347 100%);
  border-radius:50%;
  box-shadow:0 0 0 10px rgba(255,224,102,0.25),0 0 0 22px rgba(255,224,102,0.12);
  z-index:1;
  animation:sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse {
  0%,100%{box-shadow:0 0 0 10px rgba(255,224,102,0.25),0 0 0 22px rgba(255,224,102,0.12)}
  50%{box-shadow:0 0 0 20px rgba(255,224,102,0.3),0 0 0 40px rgba(255,224,102,0.1)}
}
.sun-face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:38px; }

/* GROUND */
.ground {
  position:fixed; bottom:0; left:0; right:0; height:28vh;
  background:linear-gradient(180deg,#ff9ec8 0%,#ff7eb3 60%,#e05090 100%);
  border-radius:60% 60% 0 0/20% 20% 0 0;
  z-index:2;
}
.ground::before {
  content:'';
  position:absolute; top:-12px; left:0; right:0; height:24px;
  background:
    radial-gradient(ellipse 20px 12px at 8% 50%,#ffb3d4 0%,transparent 100%),
    radial-gradient(ellipse 18px 10px at 20% 50%,#ffc8e0 0%,transparent 100%),
    radial-gradient(ellipse 22px 14px at 33% 50%,#ffacd0 0%,transparent 100%),
    radial-gradient(ellipse 16px 10px at 48% 50%,#ffb3d4 0%,transparent 100%),
    radial-gradient(ellipse 20px 12px at 63% 50%,#ffc8e0 0%,transparent 100%),
    radial-gradient(ellipse 18px 11px at 76% 50%,#ffacd0 0%,transparent 100%),
    radial-gradient(ellipse 22px 13px at 90% 50%,#ffb3d4 0%,transparent 100%);
}

/* CLOUDS */
.cloud { position:fixed; z-index:1; animation:cloudDrift linear infinite; pointer-events:none; }
.cloud-body { background:rgba(255,255,255,0.94); border-radius:50px; position:relative; }
@keyframes cloudDrift { from{transform:translateX(-200px);} to{transform:translateX(110vw);} }

/* FLOWERS */
.flower {
  position:fixed; bottom:24vh; z-index:3;
  font-size:2rem;
  animation:flowerSway 3s ease-in-out infinite;
  transform-origin:bottom center;
}
@keyframes flowerSway { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }

/* BUTTERFLIES */
.butterfly { position:fixed; font-size:1.8rem; z-index:5; pointer-events:none; animation:bflyFly linear infinite; }
@keyframes bflyFly {
  0%{transform:translate(0,0) rotate(0deg) scaleX(1);}
  25%{transform:translate(30px,-40px) rotate(5deg) scaleX(-1);}
  50%{transform:translate(60px,10px) rotate(-3deg) scaleX(1);}
  75%{transform:translate(20px,-20px) rotate(4deg) scaleX(-1);}
  100%{transform:translate(0,0) rotate(0deg) scaleX(1);}
}

/* ═══════════════════ CUTE CAT ═══════════════════ */
#cat-wrap {
  position:fixed; bottom:24vh; left:50%;
  transform:translateX(-50%);
  z-index:10; cursor:pointer;
  animation:catBob 2s ease-in-out infinite;
}
@keyframes catBob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }

.cat { position:relative; width:120px; display:flex; flex-direction:column; align-items:center; }

.cat-body {
  width:90px; height:80px;
  background:linear-gradient(160deg,#ffc8d8,#ff9eb8);
  border-radius:50% 50% 45% 45%/55% 55% 45% 45%;
  position:relative;
  box-shadow:inset -8px -6px 0 rgba(0,0,0,0.05);
}
.cat-tummy {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  width:44px; height:34px;
  background:#ffe8f0;
  border-radius:50%;
}
.cat-tummy::after { content:'💕'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:.7rem; }

.cat-head {
  width:80px; height:74px;
  background:linear-gradient(160deg,#ffc8d8,#ff9eb8);
  border-radius:50% 50% 46% 46%/56% 56% 44% 44%;
  position:relative; margin-bottom:-6px;
  box-shadow:inset -6px -5px 0 rgba(0,0,0,0.05); z-index:2;
}
.ear { position:absolute; top:-20px; width:0; height:0; border-left:18px solid transparent; border-right:18px solid transparent; border-bottom:30px solid #ff9eb8; }
.ear.left { left:4px; transform:rotate(-10deg); }
.ear.right { right:4px; transform:rotate(10deg); }
.ear::after { content:''; position:absolute; top:8px; left:-8px; width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:16px solid #ffb4c8; }

.cat-face { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding-top:10px; }
.eyes { display:flex; gap:18px; }
.eye { width:14px; height:14px; background:#2d1a0e; border-radius:50%; position:relative; animation:eyeBlink 5s ease-in-out infinite; }
@keyframes eyeBlink { 0%,48%,52%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.1)} }
.eye::after { content:''; position:absolute; top:2px; left:3px; width:5px; height:5px; background:#fff; border-radius:50%; }

.nose { font-size:10px; color:#e8607a; margin:1px 0; }
.mouth { font-size:10px; color:#c05060; display:flex; gap:2px; }
.whisker-row { display:flex; gap:28px; align-items:center; margin-top:2px; }
.whisker { width:24px; height:1.5px; background:rgba(180,80,120,0.35); border-radius:2px; }
.whisker.right { transform:rotate(5deg); }
.whisker.left  { transform:rotate(-5deg); }

.cat-tail {
  position:absolute; right:-20px; bottom:10px;
  width:44px; height:14px;
  border:6px solid #ff9eb8; border-radius:0 50px 50px 0; border-left:none;
  animation:tailWag 1.2s ease-in-out infinite;
  transform-origin:left center;
}
@keyframes tailWag { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(15deg)} }

.paws { display:flex; gap:20px; margin-top:-4px; }
.paw { width:28px; height:16px; background:linear-gradient(160deg,#ffc8d8,#ff9eb8); border-radius:50%; }

/* ═══════════════════ NAME CARD ═══════════════════ */
.msg-card {
  position:fixed; top:24px; left:50%; transform:translateX(-50%);
  z-index:20;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(14px);
  border:2.5px solid rgba(255,126,179,0.4);
  border-radius:28px;
  padding:14px 32px;
  text-align:center;
  box-shadow:0 8px 28px rgba(255,80,140,0.18);
  animation:cardSlide 1s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardSlide { from{opacity:0;transform:translateX(-50%) translateY(-40px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
.msg-card h1 {
  font-family:'Pacifico',cursive;
  font-size:clamp(1.3rem,5vw,2rem);
  background:linear-gradient(135deg,#ff3d7f,#ff7eb3,#c9a0dc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;
}
.msg-card p { font-family:'Baloo 2',cursive; font-size:.85rem; font-weight:700; color:#c07090; margin-top:4px; }

/* SPEECH BUBBLE */
#bubble {
  position:fixed; bottom:55vh; left:50%; transform:translateX(-20%);
  z-index:20;
  background:#fff; border:3px solid var(--pink); border-radius:22px;
  padding:12px 20px;
  font-family:'Baloo 2',cursive; font-size:1rem; font-weight:700;
  color:#d45080; max-width:240px; text-align:center;
  box-shadow:4px 4px 0 rgba(255,126,179,0.25);
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
#bubble::after { content:''; position:absolute; bottom:-14px; left:36px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:14px solid var(--pink); }
#bubble::before { content:''; position:absolute; bottom:-10px; left:38px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-top:11px solid #fff; z-index:1; }
#bubble.show { opacity:1; }

/* HEARTS float */
.heart-float { position:fixed; pointer-events:none; z-index:30; font-size:1.4rem; animation:heartUp 2s ease-out forwards; }
@keyframes heartUp { 0%{opacity:1;transform:translateY(0) scale(1);} 100%{opacity:0;transform:translateY(-120px) scale(0.4);} }

/* SPARK */
.spark { position:fixed; pointer-events:none; z-index:30; font-size:1.2rem; animation:sparkBurst 0.8s ease-out forwards; }
@keyframes sparkBurst { 0%{opacity:1;transform:translate(0,0) scale(1);} 100%{opacity:0;transform:var(--tx) scale(0);} }

/* PAW TRAIL */
.paw-print { position:fixed; pointer-events:none; z-index:4; font-size:1.1rem; opacity:0; animation:pawFade 2s ease forwards; }
@keyframes pawFade { 0%{opacity:0.7} 80%{opacity:0.5} 100%{opacity:0;transform:scale(0.5)} }

/* RAINBOW */
.rainbow { position:fixed; top:10vh; left:-10vw; width:120vw; height:50vh; border-radius:50%; border:18px solid transparent; z-index:1; pointer-events:none; opacity:0; animation:rbIn 3s ease-in-out forwards; }
@keyframes rbIn { 0%{opacity:0} 20%{opacity:0.65} 80%{opacity:0.65} 100%{opacity:0} }

/* KOMAL NAME sparkle */
.name-sparkle { position:fixed; pointer-events:none; z-index:25; animation:nSparkle 1.5s ease-out forwards; }
@keyframes nSparkle { 0%{opacity:1;transform:scale(0.5)} 50%{opacity:1;transform:scale(1.3)} 100%{opacity:0;transform:scale(0.3) translateY(-40px)} }

/* HINT */
.hint { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); font-size:.78rem; font-weight:700; color:#d090a0; z-index:20; letter-spacing:0.3px; animation:hintPulse 2.5s ease-in-out infinite; }
@keyframes hintPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* DUCKS */
.duck { position:fixed; bottom:22vh; z-index:6; font-size:2.2rem; animation:duckWaddle 0.6s ease-in-out infinite alternate,duckWalk linear infinite; cursor:pointer; }
@keyframes duckWaddle { 0%{transform:rotate(-8deg) translateY(0)} 100%{transform:rotate(8deg) translateY(-4px)} }
@keyframes duckWalk { 0%{left:-60px} 100%{left:110vw} }

/* HOME LINK */
.home-link {
  position:fixed; bottom:14px; right:18px; z-index:30;
  background:rgba(255,255,255,0.88); backdrop-filter:blur(10px);
  border:2px solid rgba(255,126,179,0.35); border-radius:20px;
  padding:7px 16px;
  font-family:'Baloo 2',cursive; font-size:.78rem; font-weight:800;
  color:#c07090; text-decoration:none;
  box-shadow:0 4px 14px rgba(255,80,140,0.14);
  transition:transform 0.15s;
  cursor:pointer;
}
.home-link:hover { transform:translateY(-2px); }
</style>
</head>
<body>

<div id="cur">🐾</div>
<div class="sky"></div>
<div class="sun"><div class="sun-face">☀️</div></div>
<div class="ground"></div>

<div class="msg-card">
  <h1>Hey Komal! 🐱💕</h1>
  <p>Your own tiny magical world — tap everything! ✨</p>
</div>

<div id="bubble">Purrrr~ 🐾</div>

<div id="cat-wrap">
  <div class="cat">
    <div class="cat-head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="cat-face">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="nose">▲</div>
        <div class="mouth"><span>ω</span></div>
        <div class="whisker-row">
          <div class="whisker left"></div>
          <div class="whisker right"></div>
        </div>
      </div>
    </div>
    <div class="cat-body">
      <div class="cat-tummy"></div>
      <div class="cat-tail"></div>
    </div>
    <div class="paws"><div class="paw"></div><div class="paw"></div></div>
  </div>
</div>

<div class="hint">🐾 tap the cat · tap the ducks · tap anywhere for magic!</div>
<a class="home-link" href="index.html">💕 Love World</a>

<script>
/* ── cursor ── */
const cur = document.getElementById('cur');
const curList = ['🐾','💕','✨','🌸','🐱','💖','🦋','🌹','💫'];
let ci = 0;
document.addEventListener('mousemove', e => { cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px'; });
setInterval(() => { ci=(ci+1)%curList.length; cur.textContent=curList[ci]; }, 700);

/* ── clouds ── */
function makeCloud(){
  const c=document.createElement('div'); c.className='cloud';
  const w=Math.random()*120+80,h=w*0.38,dur=Math.random()*20+18;
  c.style.top=(Math.random()*20+5)+'vh';
  c.style.animationDuration=dur+'s';
  c.style.animationDelay=-(Math.random()*dur)+'s';
  const b=document.createElement('div'); b.className='cloud-body';
  b.style.cssText=`width:${w}px;height:${h}px;`;
  [0.28,0.55,0.78].forEach(pos=>{
    const bump=document.createElement('div'),bs=Math.random()*24+18;
    bump.style.cssText=`position:absolute;width:${bs*2}px;height:${bs*2}px;background:rgba(255,255,255,0.94);border-radius:50%;top:-${bs*0.7}px;left:${pos*w-bs}px;`;
    b.appendChild(bump);
  });
  c.appendChild(b); document.body.appendChild(c);
  c.addEventListener('animationiteration',()=>{setTimeout(()=>c.remove(),500);setTimeout(makeCloud,500);});
}
for(let i=0;i<5;i++) makeCloud();

/* ── flowers ── */
['🌸','🌹','🌷','🌺','🌼','💐','🌸','🌹','🌷'].forEach((em,i)=>{
  const f=document.createElement('div'); f.className='flower';
  f.style.left=(8+i*10)+'vw'; f.style.animationDelay=(i*0.4)+'s';
  f.textContent=em; document.body.appendChild(f);
});

/* ── butterflies ── */
['🦋','🦋','🦋'].forEach((em,i)=>{
  const b=document.createElement('div'); b.className='butterfly';
  b.textContent=em; b.style.left=(15+i*28)+'vw'; b.style.top=(20+i*8)+'vh';
  b.style.animationDuration=(4+i*1.5)+'s'; b.style.animationDelay=(i*0.8)+'s';
  document.body.appendChild(b);
});

/* ── paw trail ── */
let lastPaw=0;
document.addEventListener('mousemove',e=>{
  const now=Date.now(); if(now-lastPaw<220) return; lastPaw=now;
  const el=document.createElement('div'); el.className='paw-print'; el.textContent='🐾';
  el.style.left=e.clientX+'px'; el.style.top=e.clientY+'px';
  el.style.transform='translate(-50%,-50%) rotate('+Math.random()*40+'deg)';
  el.style.animationDuration=(Math.random()*1+1.5)+'s';
  document.body.appendChild(el); setTimeout(()=>el.remove(),2500);
});

/* ── speech bubbles ── */
const meows=[
  'Purrrr~ 🐾','Mrrrow! 💕','*blinks slowly* 👀',
  'Komal!! 😻','You\'re my favourite human ever 🐱',
  'Hehehe~ ✨','*wiggles ears* 👂','*rolls over* 🌀',
  'You\'re so cute 💅','I love you SO much 💖',
  '*does zoomies* 💨','Meow meow! 🎀',
  'Stay with me forever? 🌸','You smell like sunshine 🌟',
  'You\'re my person 💕','*slow blink* ♡'
];
let meowIdx=0;
const bubble=document.getElementById('bubble');
let bubbleTimer;
function showBubble(msg){
  clearTimeout(bubbleTimer);
  bubble.textContent=msg; bubble.classList.add('show');
  bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),2400);
}

/* ── cat click ── */
const catWrap=document.getElementById('cat-wrap');
catWrap.addEventListener('click',e=>{
  e.stopPropagation();
  showBubble(meows[meowIdx++%meows.length]);
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      const h=document.createElement('div'); h.className='heart-float';
      h.textContent=['💕','💖','💗','💓','💝'][Math.floor(Math.random()*5)];
      const r=catWrap.getBoundingClientRect();
      h.style.left=(r.left+r.width/2+(Math.random()-0.5)*60)+'px';
      h.style.top=(r.top+(Math.random()-0.5)*20)+'px';
      document.body.appendChild(h); setTimeout(()=>h.remove(),2100);
    },i*100);
  }
  catWrap.style.transition='transform 0.15s';
  catWrap.style.transform='translateX(-50%) translateY(-24px) scale(1.1)';
  setTimeout(()=>{catWrap.style.transform='';catWrap.style.transition='';},300);
  if(Math.random()<0.35) spawnRainbow();
  // name sparkles
  spawnNameSparkles();
});

/* ── auto meow ── */
setInterval(()=>{ if(Math.random()<0.35) showBubble(meows[Math.floor(Math.random()*meows.length)]); },5000);
setTimeout(()=>showBubble('Hiii Komal!! 😻 I missed you!'),1200);

/* ── click anywhere ── */
document.addEventListener('click',e=>{
  if(e.target.closest('#cat-wrap,.duck,.home-link')) return;
  spawnSparks(e.clientX,e.clientY);
});

function spawnSparks(x,y){
  const ems=['✨','⭐','💫','🌟','💕','🌸','🦋','🌹'];
  for(let i=0;i<8;i++){
    const s=document.createElement('div'); s.className='spark';
    s.textContent=ems[Math.floor(Math.random()*ems.length)];
    const angle=Math.random()*Math.PI*2,dist=Math.random()*80+40;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--tx',`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`);
    s.style.animationDelay=(i*0.04)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}

function spawnNameSparkles(){
  const ems=['K','o','m','a','l','💕','✨','🌸'];
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      const s=document.createElement('div'); s.className='name-sparkle';
      s.textContent=ems[i];
      const r=catWrap.getBoundingClientRect();
      s.style.cssText=`left:${r.left+r.width/2+(Math.random()-0.5)*100}px;top:${r.top-20+(Math.random()-0.5)*30}px;
        font-family:'Pacifico',cursive;font-size:${Math.random()*0.8+0.8}rem;
        color:${['#ff3d7f','#c9a0dc','#ffb347','#6edcc4'][Math.floor(Math.random()*4)]};
        font-weight:900;z-index:25;pointer-events:none;position:fixed;`;
      document.body.appendChild(s); setTimeout(()=>s.remove(),1600);
    },i*80);
  }
}

/* ── rainbow ── */
function spawnRainbow(){
  const colors=['#ff5c7a','#ff9040','#ffe066','#6edcc4','#74c7ec','#c9a0dc'];
  colors.forEach((col,i)=>{
    const r=document.createElement('div'); r.className='rainbow';
    r.style.borderColor=col;
    r.style.width=(120-i*6)+'vw'; r.style.height=(50-i*4)+'vh';
    r.style.top=(10+i*2.5)+'vh'; r.style.left=(-10+i*3)+'vw';
    r.style.animationDelay=(i*0.05)+'s';
    document.body.appendChild(r); setTimeout(()=>r.remove(),3200);
  });
}

/* ── ducks ── */
function spawnDuck(){
  const d=document.createElement('div'); d.className='duck'; d.textContent='🐥';
  const dur=Math.random()*8+10;
  d.style.animationDuration='0.5s,'+dur+'s';
  d.style.bottom=(22+Math.random()*2)+'vh';
  document.body.appendChild(d);
  d.addEventListener('click',e=>{
    e.stopPropagation();
    spawnSparks(e.clientX,e.clientY);
    showBubble('Quack!! 🐥💕 Komal\'s favourite!');
    for(let i=0;i<20;i++) setTimeout(()=>{
      const h=document.createElement('div'); h.className='heart-float';
      h.textContent=['🌟','💕','✨','🐥'][Math.floor(Math.random()*4)];
      h.style.left=e.clientX+(Math.random()-0.5)*80+'px'; h.style.top=e.clientY+'px';
      document.body.appendChild(h); setTimeout(()=>h.remove(),2000);
    },i*50);
  });
  setTimeout(()=>d.remove(),(dur+1)*1000);
}
spawnDuck(); setInterval(spawnDuck,7000);

/* ── twinkling stars ── */
if(!document.getElementById('stwS')){
  const s=document.createElement('style'); s.id='stwS';
  s.textContent=`@keyframes starTwink{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(0.5)}}`;
  document.head.appendChild(s);
}
setInterval(()=>{
  const s=document.createElement('div');
  s.style.cssText=`position:fixed;font-size:${Math.random()*14+8}px;left:${Math.random()*90}vw;top:${Math.random()*35}vh;pointer-events:none;z-index:1;animation:starTwink ${Math.random()*2+1}s ease-in-out forwards;`;
  s.textContent=['⭐','✨','💫','🌟'][Math.floor(Math.random()*4)];
  document.body.appendChild(s); setTimeout(()=>s.remove(),3000);
},800);

document.addEventListener('touchstart',e=>{ spawnSparks(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
