<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Komal 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff7f0;
  --pink: #ff7eb3;
  --peach: #ffb347;
  --yellow: #ffe066;
  --mint: #6edcc4;
  --sky: #74c7ec;
  --lilac: #c9a0dc;
  --red: #ff5c7a;
  --brown: #c87941;
  --cream: #fff3e0;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  width: 100vw; height: 100vh;
  cursor: none;
  user-select: none;
}

/* ── custom cursor ── */
#cur {
  position: fixed; pointer-events:none; z-index:9999;
  transform: translate(-50%,-50%);
  font-size: 22px;
  transition: transform 0.08s;
}

/* ═══════════════════════════
   SKY + GROUND SCENE
═══════════════════════════ */
.sky {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #ffe8f4 0%, #ffd6e8 30%, #ffe8c0 65%, #ffd6a5 100%);
  z-index: 0;
}

/* Sun */
.sun {
  position: fixed;
  top: 40px; right: 80px;
  width: 80px; height: 80px;
  background: radial-gradient(circle, #ffe066 60%, #ffb347 100%);
  border-radius: 50%;
  box-shadow: 0 0 0 10px rgba(255,224,102,0.25), 0 0 0 22px rgba(255,224,102,0.12);
  z-index: 1;
  animation: sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse {
  0%,100%{box-shadow:0 0 0 10px rgba(255,224,102,0.25),0 0 0 22px rgba(255,224,102,0.12)}
  50%{box-shadow:0 0 0 18px rgba(255,224,102,0.3),0 0 0 36px rgba(255,224,102,0.1)}
}
.sun-face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:40px; }

/* Ground */
.ground {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 28vh;
  background: linear-gradient(180deg, #a8e063 0%, #78c840 60%, #5aaa28 100%);
  border-radius: 60% 60% 0 0 / 20% 20% 0 0;
  z-index: 2;
}
.ground::before {
  content:'';
  position:absolute; top:-12px; left:0; right:0; height:24px;
  background: radial-gradient(ellipse 20px 12px at 10% 50%, #b8ee73 0%, transparent 100%),
              radial-gradient(ellipse 18px 10px at 22% 50%, #c2f080 0%, transparent 100%),
              radial-gradient(ellipse 22px 14px at 35% 50%, #aadc5a 0%, transparent 100%),
              radial-gradient(ellipse 16px 10px at 50% 50%, #b8ee73 0%, transparent 100%),
              radial-gradient(ellipse 20px 12px at 65% 50%, #c2f080 0%, transparent 100%),
              radial-gradient(ellipse 18px 11px at 78% 50%, #aadc5a 0%, transparent 100%),
              radial-gradient(ellipse 22px 13px at 90% 50%, #b8ee73 0%, transparent 100%);
}

/* ═══════════════════════════
   CLOUDS
═══════════════════════════ */
.cloud {
  position: fixed;
  z-index: 1;
  animation: cloudDrift linear infinite;
  pointer-events: none;
}
.cloud-body {
  background: rgba(255,255,255,0.92);
  border-radius: 50px;
  position: relative;
  box-shadow: 0 4px 16px rgba(255,180,200,0.2);
}
.cloud-body::before,.cloud-body::after {
  content:'';
  position:absolute;
  background: rgba(255,255,255,0.92);
  border-radius: 50%;
}
@keyframes cloudDrift {
  from { transform: translateX(-200px); }
  to   { transform: translateX(110vw); }
}

/* ═══════════════════════════
   FLOWERS
═══════════════════════════ */
.flower {
  position: fixed;
  bottom: 22vh;
  z-index: 3;
  font-size: 2rem;
  animation: flowerSway 3s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes flowerSway {
  0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)}
}

/* ═══════════════════════════
   BUTTERFLIES
═══════════════════════════ */
.butterfly {
  position: fixed;
  font-size: 1.8rem;
  z-index: 5;
  pointer-events: none;
  animation: butterflyFly linear infinite;
}
@keyframes butterflyFly {
  0%   { transform: translate(0,0) rotate(0deg) scaleX(1); }
  25%  { transform: translate(30px,-40px) rotate(5deg) scaleX(-1); }
  50%  { transform: translate(60px,10px) rotate(-3deg) scaleX(1); }
  75%  { transform: translate(20px,-20px) rotate(4deg) scaleX(-1); }
  100% { transform: translate(0,0) rotate(0deg) scaleX(1); }
}

/* ═══════════════════════════
   MAIN CAT CHARACTER
═══════════════════════════ */
#cat-wrap {
  position: fixed;
  bottom: 24vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  cursor: pointer;
  animation: catBob 2s ease-in-out infinite;
}
@keyframes catBob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }

.cat {
  position: relative;
  width: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* body */
.cat-body {
  width: 90px; height: 80px;
  background: linear-gradient(160deg, #ffcf88, #f4a940);
  border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
  position: relative;
  box-shadow: inset -8px -6px 0 rgba(0,0,0,0.07);
}

/* tummy */
.cat-tummy {
  position: absolute;
  bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 44px; height: 34px;
  background: #ffe8c0;
  border-radius: 50%;
}

/* head */
.cat-head {
  width: 80px; height: 74px;
  background: linear-gradient(160deg, #ffcf88, #f4a940);
  border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
  position: relative;
  margin-bottom: -6px;
  box-shadow: inset -6px -5px 0 rgba(0,0,0,0.07);
  z-index: 2;
}

/* ears */
.ear {
  position: absolute;
  top: -20px;
  width: 0; height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-bottom: 30px solid #f4a940;
}
.ear.left { left: 4px; transform: rotate(-10deg); }
.ear.right { right: 4px; transform: rotate(10deg); }
.ear::after {
  content:'';
  position:absolute;
  top: 8px; left: -8px;
  width: 0; height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-bottom: 16px solid #ffb4b4;
}

/* face */
.cat-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding-top: 10px;
}

.eyes {
  display: flex; gap: 18px;
}
.eye {
  width: 14px; height: 14px;
  background: #2d1a0e;
  border-radius: 50%;
  position: relative;
  animation: eyeBlink 5s ease-in-out infinite;
}
@keyframes eyeBlink {
  0%,48%,52%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.1)}
}
.eye::after {
  content:'';
  position:absolute;
  top:2px; left:3px;
  width:5px; height:5px;
  background:#fff;
  border-radius:50%;
}

.nose {
  font-size: 10px;
  color: #e8607a;
  margin: 1px 0;
}
.mouth {
  font-size: 10px;
  color: #c05060;
  display: flex; gap:2px;
}
.whisker-row {
  display: flex; gap: 28px; align-items: center; margin-top: 2px;
}
.whisker {
  width: 24px; height: 1.5px;
  background: rgba(100,60,30,0.4);
  border-radius: 2px;
}
.whisker.right { transform: rotate(5deg); }
.whisker.left  { transform: rotate(-5deg); }

/* tail */
.cat-tail {
  position: absolute;
  right: -20px; bottom: 10px;
  width: 44px; height: 14px;
  border: 6px solid #f4a940;
  border-radius: 0 50px 50px 0;
  border-left: none;
  animation: tailWag 1.2s ease-in-out infinite;
  transform-origin: left center;
}
@keyframes tailWag { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(15deg)} }

/* paws */
.paws { display:flex; gap:20px; margin-top:-4px; }
.paw {
  width: 28px; height: 16px;
  background: linear-gradient(160deg, #ffcf88, #f4a940);
  border-radius: 50%;
  box-shadow: inset -3px -2px 0 rgba(0,0,0,0.07);
}

/* ═══════════════════════════
   SPEECH BUBBLE
═══════════════════════════ */
#bubble {
  position: fixed;
  bottom: 56vh;
  left: 50%;
  transform: translateX(-30%);
  z-index: 20;
  background: #fff;
  border: 3px solid var(--pink);
  border-radius: 22px;
  padding: 12px 20px;
  font-family: 'Baloo 2', cursive;
  font-size: 1rem;
  font-weight: 600;
  color: #d45080;
  max-width: 220px;
  text-align: center;
  box-shadow: 4px 4px 0 rgba(255,126,179,0.25);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
#bubble::after {
  content:'';
  position:absolute;
  bottom:-14px; left:36px;
  width:0; height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:14px solid var(--pink);
}
#bubble::before {
  content:'';
  position:absolute;
  bottom:-10px; left:38px;
  width:0; height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:11px solid #fff;
  z-index:1;
}
#bubble.show { opacity:1; }

/* ═══════════════════════════
   TOP MESSAGE CARD
═══════════════════════════ */
.msg-card {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  border: 2.5px solid rgba(255,126,179,0.45);
  border-radius: 24px;
  padding: 12px 28px;
  text-align: center;
  box-shadow: 0 8px 28px rgba(255,126,179,0.18);
  animation: cardSlideIn 1s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardSlideIn { from{opacity:0;transform:translateX(-50%) translateY(-40px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

.msg-card h1 {
  font-family: 'Baloo 2', cursive;
  font-size: clamp(1.3rem,4vw,1.9rem);
  font-weight: 800;
  background: linear-gradient(135deg, #ff5c7a, #ff7eb3, #c9a0dc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  line-height: 1.2;
}
.msg-card p {
  font-size: 0.85rem;
  font-weight: 700;
  color: #c07090;
  margin-top: 3px;
}

/* ═══════════════════════════
   MINI HEARTS that float up
═══════════════════════════ */
.heart-float {
  position: fixed;
  pointer-events: none;
  z-index: 30;
  font-size: 1.4rem;
  animation: heartUp 2s ease-out forwards;
}
@keyframes heartUp {
  0%  {opacity:1; transform:translateY(0) scale(1) rotate(0deg);}
  100%{opacity:0; transform:translateY(-120px) scale(0.4) rotate(20deg);}
}

/* ═══════════════════════════
   STARS / SPARKLE click burst
═══════════════════════════ */
.spark {
  position: fixed;
  pointer-events: none;
  z-index: 30;
  font-size: 1.2rem;
  animation: sparkBurst 0.8s ease-out forwards;
}
@keyframes sparkBurst {
  0%  {opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:var(--tx) scale(0);}
}

/* ═══════════════════════════
   PAW PRINTS trail
═══════════════════════════ */
.paw-print {
  position: fixed;
  pointer-events: none;
  z-index: 4;
  font-size: 1.1rem;
  opacity: 0;
  animation: pawFade 2s ease forwards;
}
@keyframes pawFade { 0%{opacity:0.8} 80%{opacity:0.6} 100%{opacity:0;transform:scale(0.5)} }

/* ═══════════════════════════
   RAINBOW on demand
═══════════════════════════ */
.rainbow {
  position: fixed;
  top: 10vh; left: -10vw;
  width: 120vw; height: 50vh;
  border-radius: 50%;
  border: 18px solid transparent;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  animation: rainbowIn 3s ease-in-out forwards;
}
@keyframes rainbowIn { 0%{opacity:0} 20%{opacity:0.7} 80%{opacity:0.7} 100%{opacity:0} }

/* ═══════════════════════════
   BOTTOM HINT
═══════════════════════════ */
.hint {
  position: fixed;
  bottom: 10px; left: 50%;
  transform: translateX(-50%);
  font-size: 0.78rem;
  font-weight: 700;
  color: #c0a090;
  z-index: 20;
  letter-spacing: 0.3px;
  animation: hintPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* ═══════════════════════════
   DANCING DUCKS (bonus silly)
═══════════════════════════ */
.duck {
  position: fixed;
  bottom: 22vh;
  z-index: 6;
  font-size: 2.2rem;
  animation: duckWaddle 0.6s ease-in-out infinite alternate, duckWalk linear infinite;
  cursor: pointer;
}
@keyframes duckWaddle { 0%{transform:rotate(-8deg) translateY(0)} 100%{transform:rotate(8deg) translateY(-4px)} }
@keyframes duckWalk   { 0%{left:-60px} 100%{left:110vw} }
</style>
</head>
<body>

<div id="cur">🐾</div>

<!-- SKY & SCENE -->
<div class="sky"></div>

<div class="sun"><div class="sun-face">☀️</div></div>

<!-- GROUND -->
<div class="ground"></div>

<!-- TOP CARD -->
<div class="msg-card">
  <h1>Hey Komal! 🐱💕</h1>
  <p>Just a tiny world made for you ✨ tap everything!</p>
</div>

<!-- SPEECH BUBBLE -->
<div id="bubble">Purrrr~ 🐾</div>

<!-- CAT -->
<div id="cat-wrap">
  <div class="cat">
    <div class="cat-head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="cat-face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="nose">▲</div>
        <div class="mouth"><span>ω</span></div>
        <div class="whisker-row">
          <div class="whisker left"></div>
          <div class="whisker right"></div>
        </div>
      </div>
    </div>
    <div class="cat-body">
      <div class="cat-tummy"></div>
      <div class="cat-tail"></div>
    </div>
    <div class="paws">
      <div class="paw"></div>
      <div class="paw"></div>
    </div>
  </div>
</div>

<div class="hint">🐾 tap the cat · tap the ducks · tap anywhere!</div>

<script>
// ══ Cursor ══
const cur = document.getElementById('cur');
const curList = ['🐾','💕','✨','🌸','🐱','💖','🦋','⭐'];
let ci = 0;
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px';
  cur.style.top  = e.clientY+'px';
});
setInterval(()=>{ ci=(ci+1)%curList.length; cur.textContent=curList[ci]; }, 700);

// ══ Clouds ══
function makeCloud(){
  const c = document.createElement('div');
  c.className = 'cloud';
  const h = Math.random()*20+5;
  const w = Math.random()*120+80;
  const dur = Math.random()*20+18;
  c.style.top = h+'vh';
  c.style.animationDuration = dur+'s';
  c.style.animationDelay = -(Math.random()*dur)+'s';
  const b = document.createElement('div');
  b.className = 'cloud-body';
  b.style.cssText = `width:${w}px;height:${w*0.38}px;`;
  b.style.setProperty('--w', w+'px');
  // bumps
  [0.28, 0.55, 0.78].forEach(pos=>{
    const bump=document.createElement('div');
    const bs = Math.random()*24+18;
    bump.style.cssText=`position:absolute;width:${bs*2}px;height:${bs*2}px;background:rgba(255,255,255,0.92);border-radius:50%;top:-${bs*0.7}px;left:${pos*w - bs}px;`;
    b.appendChild(bump);
  });
  c.appendChild(b);
  document.body.appendChild(c);
  c.addEventListener('animationiteration', ()=>{ setTimeout(()=>c.remove(), 500); setTimeout(makeCloud,500); });
}
for(let i=0;i<5;i++) makeCloud();

// ══ Flowers ══
const flowerEmojis = ['🌸','🌼','🌷','🌺','🌻','💐'];
[8,18,28,38,50,62,72,82,90].forEach((pos,i)=>{
  const f = document.createElement('div');
  f.className = 'flower';
  f.style.left = pos+'vw';
  f.style.animationDelay = (i*0.4)+'s';
  f.textContent = flowerEmojis[i%flowerEmojis.length];
  document.body.appendChild(f);
});

// ══ Butterflies ══
['🦋','🦋','🦋'].forEach((em,i)=>{
  const b=document.createElement('div');
  b.className='butterfly';
  b.textContent=em;
  b.style.left=(15+i*28)+'vw';
  b.style.top=(20+i*8)+'vh';
  b.style.animationDuration=(4+i*1.5)+'s';
  b.style.animationDelay=(i*0.8)+'s';
  document.body.appendChild(b);
});

// ══ Paw print trail ══
let lastPaw = 0;
document.addEventListener('mousemove', e=>{
  const now = Date.now();
  if(now-lastPaw < 220) return;
  lastPaw = now;
  const el = document.createElement('div');
  el.className='paw-print';
  el.textContent='🐾';
  el.style.left=e.clientX+'px';
  el.style.top=e.clientY+'px';
  el.style.transform='translate(-50%,-50%) rotate('+Math.random()*40+'deg)';
  el.style.animationDuration=(Math.random()*1+1.5)+'s';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
});

// ══ Speech bubbles ══
const meows = [
  'Purrrr~ 🐾','Mrrrow! 💕','*blinks slowly* 👀',
  'Komal!! 😻','You\'re my fav hooman 🐱','Hehehe~ ✨',
  '*wiggles ears* 👂','*rolls over* 🌀','Feed me compliments 💅',
  'I love youuu 💖','*does zoomies* 💨','Meow meow! 🎀'
];
let meowIdx = 0;
const bubble = document.getElementById('bubble');
let bubbleTimer;

function showBubble(msg){
  clearTimeout(bubbleTimer);
  bubble.textContent = msg;
  bubble.classList.add('show');
  bubbleTimer = setTimeout(()=>bubble.classList.remove('show'), 2200);
}

// Cat click
const catWrap = document.getElementById('cat-wrap');
catWrap.addEventListener('click', e=>{
  e.stopPropagation();
  showBubble(meows[meowIdx++%meows.length]);
  // hearts burst
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      const h=document.createElement('div');
      h.className='heart-float';
      h.textContent=['💕','💖','💗','💓'][Math.floor(Math.random()*4)];
      const r=catWrap.getBoundingClientRect();
      h.style.left=(r.left+r.width/2+(Math.random()-0.5)*60)+'px';
      h.style.top=(r.top+(Math.random()-0.5)*20)+'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),2000);
    },i*100);
  }
  // cat jump
  catWrap.style.transition='transform 0.15s';
  catWrap.style.transform='translateX(-50%) translateY(-24px) scale(1.1)';
  setTimeout(()=>{ catWrap.style.transform=''; catWrap.style.transition=''; },300);
  // random rainbow
  if(Math.random()<0.3) spawnRainbow();
});

// Auto meow
setInterval(()=>{ if(Math.random()<0.35) showBubble(meows[meowIdx++%meowIdx]); }, 5000);
setTimeout(()=>showBubble('Hiii Komal!! 😻'), 1200);

// ══ Click anywhere ══
document.addEventListener('click', e=>{
  if(e.target.closest('#cat-wrap,.duck')) return;
  spawnSparks(e.clientX, e.clientY);
});

function spawnSparks(x,y){
  const ems=['✨','⭐','💫','🌟','💕','🌸'];
  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.textContent=ems[Math.floor(Math.random()*ems.length)];
    const angle=Math.random()*Math.PI*2;
    const dist=Math.random()*80+40;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--tx',`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`);
    s.style.animationDelay=(i*0.04)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),900);
  }
}

// ══ Rainbow ══
function spawnRainbow(){
  const colors=['#ff5c7a','#ff9040','#ffe066','#6edcc4','#74c7ec','#c9a0dc'];
  colors.forEach((col,i)=>{
    const r=document.createElement('div');
    r.className='rainbow';
    r.style.borderColor=col;
    r.style.width=(120-i*6)+'vw';
    r.style.height=(50-i*4)+'vh';
    r.style.top=(10+i*2.5)+'vh';
    r.style.left=(-10+i*3)+'vw';
    r.style.animationDelay=(i*0.05)+'s';
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),3200);
  });
}

// ══ Ducks ══
function spawnDuck(){
  const d=document.createElement('div');
  d.className='duck';
  d.textContent='🐥';
  const dur=Math.random()*8+10;
  d.style.animationDuration='0.5s,'+dur+'s';
  d.style.bottom=(22+Math.random()*2)+'vh';
  d.style.animationDelay='0s,0s';
  document.body.appendChild(d);
  d.addEventListener('click',e=>{
    e.stopPropagation();
    spawnSparks(e.clientX,e.clientY);
    showBubble('Quack!! 🐥💕');
    // confetti
    for(let i=0;i<20;i++) setTimeout(()=>{
      const h=document.createElement('div');
      h.className='heart-float';
      h.textContent=['🌟','💕','✨','🐥'][Math.floor(Math.random()*4)];
      h.style.left=e.clientX+(Math.random()-0.5)*80+'px';
      h.style.top=e.clientY+'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),2000);
    },i*50);
  });
  setTimeout(()=>d.remove(),(dur+1)*1000);
}
spawnDuck();
setInterval(spawnDuck, 7000);

// ══ Stars in sky periodically ══
setInterval(()=>{
  const s=document.createElement('div');
  s.style.cssText=`position:fixed;font-size:${Math.random()*14+10}px;left:${Math.random()*90}vw;top:${Math.random()*35}vh;pointer-events:none;z-index:1;animation:starTwink ${Math.random()*2+1}s ease-in-out forwards;`;
  s.textContent='⭐';
  if(!document.getElementById('stwStyle')){
    const st=document.createElement('style');
    st.id='stwStyle';
    st.textContent=`@keyframes starTwink{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(0.5)}}`;
    document.head.appendChild(st);
  }
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),3000);
},900);

// ══ Touch support ══
document.addEventListener('touchstart', e=>{
  const t=e.touches[0];
  spawnSparks(t.clientX, t.clientY);
},{passive:true});
</script>
